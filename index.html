<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully ignore benign Vite HMR WebSocket closure in cloud sandbox environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('@vite/client') !== -1 || msg.indexOf('vite-hmr') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || event.filename)) || '';
        if (typeof msg === 'string' && (msg.indexOf('@vite/client') !== -1 || msg.indexOf('WebSocket') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
